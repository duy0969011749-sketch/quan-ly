<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B2B2E">
<title>Quản lý công việc</title>
<style>
@font-face{font-family:"Plus Jakarta Sans";font-style:normal;font-display:swap;font-weight:200 800;src:url(fonts/plus-jakarta-sans-vietnamese.woff2) format("woff2");unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB}
@font-face{font-family:"Plus Jakarta Sans";font-style:normal;font-display:swap;font-weight:200 800;src:url(fonts/plus-jakarta-sans-latin-ext.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Plus Jakarta Sans";font-style:normal;font-display:swap;font-weight:200 800;src:url(fonts/plus-jakarta-sans-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  --bg:#F3F7F7;--card:#FFFFFF;--text:#0F172A;--muted:#5B6678;--line:#E3E8F0;--line2:#D3DAE6;--soft:#F1F4F9;--track:#E7ECF4;
  --accent:#0F766E;--accent-h:#115E59;--accent-soft:#E0F2F0;--nav:#0B2B2E;--nav-text:#A7C2C2;--nav-on:#2DD4BF;--on-accent:#FFFFFF;
  --danger:#DC2626;--danger-soft:#FEF2F2;--ok:#0B8F5E;
  --p0:#DC2626;--p1:#D97706;--p2:#0F766E;--p3:#94A3B8;
  --pb0:#FEF2F2;--pb1:#FFF7ED;--pb2:#E6F4F2;--pb3:#F1F5F9;
  --c-done:#1baf7a;--c-doing:#2a78d6;--c-todo:#a3a3a8;--c-late:#d03b3b;
  --sh:0 1px 2px rgba(15,23,42,.04),0 1px 3px rgba(15,23,42,.05);--sh2:0 12px 32px rgba(15,23,42,.16);
  --r:5px;--font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:16px;line-height:1.5;padding-bottom:calc(76px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;transition:background-color .15s,color .15s,border-color .15s,opacity .15s}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
header{max-width:760px;margin:0 auto;padding:22px 20px 2px;display:flex;justify-content:space-between;align-items:center;gap:12px}
header h1{font-size:26px;margin:0;font-weight:800;letter-spacing:-.03em}
#sync{font-size:12px;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
#sync:not(:empty)::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
#sync.err{color:var(--danger)}
#sync.err::before{background:var(--danger)}
.wrap{max-width:760px;margin:0 auto;padding:8px 20px 32px}
#datebar{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:5px;padding:3px;margin:12px 0;box-shadow:var(--sh)}
#datebar button{background:none;border:0;min-height:44px;min-width:44px;font-size:22px;line-height:1;color:var(--muted);border-radius:11px}
#datebar button:hover{background:var(--soft);color:var(--text)}
#datebar .lbl{flex:1;font-size:15px;font-weight:700;color:var(--text)}
#filter{margin-bottom:14px}
.seg{display:flex;gap:4px;background:var(--track);padding:4px;border-radius:12px;margin-bottom:20px}
.seg button{flex:1;background:none;border:0;border-radius:9px;padding:0 12px;min-height:40px;color:var(--muted);font-size:14px;font-weight:600}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--card);color:var(--accent-h);box-shadow:0 1px 2px rgba(15,23,42,.1)}
.sec{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:24px 0 8px;min-height:28px}
.sec > span:not(.sp){letter-spacing:0;font-weight:600;background:var(--track);color:var(--muted);border-radius:999px;padding:1px 8px;font-size:11px;line-height:18px}
.sec .sp{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px;box-shadow:var(--sh)}
.card h2{font-size:15px;margin:0 0 16px;font-weight:700;color:var(--text);letter-spacing:-.01em}
.quick{display:flex;gap:8px;align-items:center}
.quick input[type=text]{flex:1;min-width:0}
.quick select{width:auto;flex:0 0 auto;max-width:42%}
@media (max-width:599px){.quick.q3{flex-wrap:wrap}.quick.q3 input[type=text]{flex:1 1 100%}.quick.q3 select{flex:1 1 auto;max-width:none}}
.cols .qbox{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 2px;margin-bottom:12px;box-shadow:var(--sh)}
input[type=text],input[type=password],input[type=date],input[type=datetime-local],select,textarea{background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:10px 14px;min-height:44px;width:100%;font-size:16px;transition:border-color .15s,box-shadow .15s}
input::placeholder,textarea::placeholder{color:#66728A}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(15,118,110,.2)}
textarea{min-height:96px;resize:vertical;display:block}
.btn{background:var(--accent);color:var(--on-accent);border:1px solid var(--accent);border-radius:12px;min-height:44px;padding:0 20px;font-weight:700;white-space:nowrap}
.btn:hover{background:var(--accent-h);border-color:var(--accent-h)}
.btn.ghost{background:var(--card);color:var(--text);border-color:var(--line2);font-weight:600}
.btn.ghost:hover{background:var(--soft);border-color:var(--line2)}
.btn.danger{background:var(--card);color:var(--danger);border-color:#FECACA;font-weight:600}
.btn.danger:hover{background:var(--danger-soft);border-color:#FECACA}
.btn.small{min-height:36px;padding:0 14px;font-size:13px}
.link{background:none;border:0;color:var(--accent-h);padding:0;min-height:44px;font-size:14px;font-weight:600}
.link:hover{text-decoration:underline}
.od{color:var(--danger)}
.task{display:flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:5px;margin-bottom:8px;padding:0 12px 0 6px;min-height:54px;transition:border-color .15s}
.task:hover{border-color:var(--line2)}
.chk{flex:0 0 44px;width:44px;height:44px;background:none;border:0;position:relative;padding:0}
.chk::before{content:"";position:absolute;inset:11px;border:1.5px solid #94A3B8;border-radius:50%;transition:background-color .15s,border-color .15s}
.chk:hover::before{border-color:var(--accent)}
.task.doing .chk::before{border-color:var(--accent)}
.task.doing .chk::after{content:"";position:absolute;inset:17px;border-radius:50%;background:var(--accent)}
.task.done .chk::before{background:var(--ok);border-color:var(--ok)}
.task.done .chk::after{content:"";position:absolute;left:19px;top:15px;width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.tb{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:0;text-align:left;padding:10px 0;min-height:44px}
.tt{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:500}
.task.done .tt{text-decoration:line-through;color:var(--muted);font-weight:400}
.tr{font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.tr.od{color:var(--danger);font-weight:700}
.pd{flex:0 0 8px;width:8px;height:8px;border-radius:50%;display:inline-block}
.pd.p0{background:var(--p0)}.pd.p1{background:var(--p1)}.pd.p2{background:var(--p2)}.pd.p3{background:var(--p3)}
.mv{margin-left:8px}
.empty{color:var(--muted);font-size:14px;padding:18px 0;text-align:center}
.dn{background:none;border:0;padding:0;min-height:44px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dn.now{color:var(--on-accent);background:var(--accent);border-radius:999px;min-height:26px;padding:0 10px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
@media (min-width:600px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);display:flex;flex-direction:column-reverse;gap:2px}
.stat .v{font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1.15;font-variant-numeric:tabular-nums}
.stat .k{font-size:13px;font-weight:600;color:var(--muted)}
.stat.warn{background:var(--danger-soft);border-color:#FECACA}
.stat.warn .v{color:var(--danger)}
.bar{height:8px;background:var(--track);border-radius:999px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:999px}
.prow{display:grid;grid-template-columns:128px 1fr 76px;gap:12px;align-items:center;margin:12px 0;font-size:14px}
.prow .nm{display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.prow .n{text-align:right;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.kpi{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;margin-bottom:14px}
.kpi .score{font-size:56px;font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.kpi .score::after{content:"/100";font-size:15px;font-weight:600;letter-spacing:0;color:var(--muted);margin-left:4px}
.kpi .det{font-size:14px;color:var(--muted)}
details{margin-top:8px}
summary{font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;min-height:44px;line-height:44px}
details p{font-size:14px;color:var(--muted);margin:0 0 8px}
.chart{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:140px}
.col{display:flex;flex-direction:column;justify-content:flex-end;height:100%;align-items:center;gap:4px}
.col .num{font-size:11px;font-weight:600;color:var(--muted)}
.chart-x{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;font-size:12px;font-weight:600;text-align:center;color:var(--muted);margin-top:6px}
.trend{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:end;height:110px}
.trend .tc{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px;font-size:12px;color:var(--muted)}
.trend .tb2{width:100%;max-width:48px;background:var(--accent);border-radius:6px 6px 0 0;min-height:2px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:84%;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px}
.board .colm{scroll-snap-align:start;background:var(--track);border-radius:var(--r);padding:6px 12px 8px;min-height:160px}
.board .task{flex-wrap:wrap}
.board .tb{flex:1 1 calc(100% - 46px);flex-wrap:wrap;gap:4px 10px;padding:12px 0}
.board .tt{flex:1 1 100%}
.board .mv{margin:0 0 12px 34px}
@media (min-width:760px){.board{grid-auto-flow:row;grid-template-columns:repeat(3,1fr);grid-auto-columns:auto;overflow:visible}}
.proj{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:12px;box-shadow:var(--sh)}
button.proj:hover{border-color:var(--accent)}
.proj .pn{font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between;gap:8px}
.proj .pn span:last-child{color:var(--accent-h);font-weight:700;font-variant-numeric:tabular-nums}
.proj .pm{font-size:13px;color:var(--muted);margin-top:10px}
.note{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:14px 16px;margin-bottom:8px}
.note .tx{white-space:pre-wrap;overflow-wrap:anywhere}
.note .ft{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px}
.note .tmn{font-size:13px;color:var(--muted)}
.note .ft span:last-child{display:flex;gap:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 6px}
.hint{font-size:14px;color:var(--muted);margin:0 0 12px}
.err{color:var(--danger);font-size:13px;margin-top:8px;min-height:1em}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(255,255,255,.96);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;min-height:58px;font-size:12px;font-weight:600;color:var(--muted);padding:0 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
nav button::before{content:"";width:20px;height:3px;border-radius:3px;background:transparent}
nav button.on{color:var(--accent-h)}
nav button.on::before{background:var(--accent)}
#sheet{position:fixed;inset:0;z-index:10;background:rgba(15,23,42,.45);display:none;align-items:flex-end;justify-content:center}
#sheet.open{display:flex;animation:fade .18s ease-out}
#sheet .panel{background:var(--card);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:22px 20px;padding-bottom:calc(22px + env(safe-area-inset-bottom));box-shadow:var(--sh2)}
#sheet.open .panel{animation:up .24s cubic-bezier(.2,.8,.2,1)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(28px);opacity:.6}to{transform:none;opacity:1}}
@media (max-width:599px){#sheet .panel::before{content:"";display:block;width:36px;height:4px;border-radius:4px;background:#CBD5E1;margin:-10px auto 14px}}
@media (min-width:600px){#sheet{align-items:center}#sheet .panel{border-radius:20px}}
#sheet h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:380px){.two{grid-template-columns:1fr}}
#toasts{position:fixed;left:12px;right:12px;top:12px;z-index:20;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{pointer-events:auto;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:5px;padding:12px 14px;max-width:480px;width:100%;box-shadow:var(--sh2);display:flex;gap:10px;align-items:center}
.toast .tx{flex:1;font-size:14px;color:var(--muted)}
.toast .tx b{display:block;color:var(--text)}
.toast button{background:none;border:0;font-weight:700;color:var(--accent-h);min-height:44px;padding:0 6px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin-top:14px}
.legend i,.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.donut{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.donut svg{width:132px;height:132px;flex:0 0 auto}
.donut .c1{font-size:22px;font-weight:800;fill:var(--text)}
.donut .c2{font-size:9px;fill:var(--muted)}
.lg{flex:1;min-width:140px;font-size:14px}
.lg div{display:flex;align-items:center;padding:5px 0}
.lg div span{flex:1}
.lg div b{font-weight:700;font-variant-numeric:tabular-nums}
.stack2{display:flex;flex-direction:column-reverse;gap:2px;width:100%;max-width:32px;min-height:2px}
.stack2 i{display:block;min-height:3px;border-radius:2px}
.stack2 i:last-child{border-radius:6px 6px 2px 2px}
.stack2.zero{background:var(--track);border-radius:2px}
.mbar{display:flex;gap:2px;height:8px;background:var(--track);border-radius:999px;overflow:hidden}
.mbar i{display:block;height:100%}
.line{display:block;width:100%;max-width:560px;margin:0 auto}
.line text{font-size:10px;fill:var(--muted)}
.line .val{font-size:12px;font-weight:700;fill:var(--text)}
.line .grid{stroke:var(--line);stroke-width:1}
.line .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.line circle{fill:var(--accent);stroke:var(--card);stroke-width:2}
/* lich ngay */
.tlwrap{max-height:calc(100vh - 190px);min-height:380px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.tl{position:relative}
.hl{position:absolute;left:0;width:46px;text-align:right;font-size:12px;font-weight:500;color:var(--muted);padding-top:6px;font-variant-numeric:tabular-nums;pointer-events:none}
.hr{position:absolute;left:54px;right:0;height:64px;background:none;border:0;border-top:1px solid #EDF1F6;padding:0;border-radius:0}
.hr::after{content:"Thêm việc";position:absolute;left:10px;top:8px;font-size:12px;font-weight:600;color:var(--accent-h);opacity:0;transition:opacity .15s}
.hr:hover{background:var(--accent-soft)}
.hr:hover::after,.hr:focus-visible::after{opacity:1}
.evs{position:absolute;left:58px;right:6px;top:0;bottom:0;pointer-events:none}
.ev{position:absolute;z-index:1;pointer-events:auto;display:flex;align-items:stretch;background:var(--pb2);border:1px solid rgba(15,23,42,.06);border-left:4px solid var(--p2);border-radius:10px;overflow:hidden}
.ev.p0{background:var(--pb0);border-left-color:var(--p0)}.ev.p1{background:var(--pb1);border-left-color:var(--p1)}.ev.p2{background:var(--pb2);border-left-color:var(--p2)}.ev.p3{background:var(--pb3);border-left-color:var(--p3)}
.ev.doing{box-shadow:inset 0 0 0 1.5px var(--accent)}
.ev.done{opacity:.55}
.ev .chk{flex:0 0 34px;width:34px;height:auto;margin:0}
.ev .chk::before{box-sizing:border-box;inset:auto;left:8px;top:50%;width:18px;height:18px;margin-top:-9px}
.ev.doing .chk::before{border-color:var(--accent)}
.ev.doing .chk::after{content:"";position:absolute;left:14px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--accent)}
.ev.done .chk::before{background:var(--ok);border-color:var(--ok)}
.ev.done .chk::after{content:"";position:absolute;left:14px;top:50%;margin-top:-7px;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.eb{flex:1;min-width:0;background:none;border:0;text-align:left;padding:3px 8px 3px 0;display:flex;flex-direction:column;justify-content:center}
.et{font-size:14px;font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.done .et{text-decoration:line-through}
.em{font-size:12px;line-height:1.25;color:var(--muted);font-variant-numeric:tabular-nums}
.nowln{position:absolute;left:54px;right:0;height:0;border-top:2px solid var(--danger);pointer-events:none;z-index:2}
.nowln::before{content:"";position:absolute;left:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--danger)}
.nowln::after{content:attr(data-t);position:absolute;left:-54px;top:-10px;width:46px;text-align:center;font-size:11px;font-weight:700;line-height:18px;border-radius:999px;background:var(--danger);color:#fff;font-variant-numeric:tabular-nums}
.fold .fb{display:block}
.fold.hide:not(.open) .fl{display:none}
.fold.cap:not(.open) .fl .task:nth-child(n+3){display:none}
@media (max-width:899px){
  .cols{display:flex;flex-direction:column}
  .cols > div{display:contents}
  .cols .o1{order:1}.cols .o2{order:2}.cols .o3{order:3}.cols .o4{order:4}
}
.pgrid,.sgrid,.dgrid{display:block}
@media (min-width:900px){
  body{padding-left:232px;padding-bottom:0}
  nav{top:0;right:auto;width:232px;flex-direction:column;justify-content:flex-start;border-top:0;border-right:1px solid var(--line);background:var(--card);padding:24px 12px 0;gap:2px}

<script>
(function(){
'use strict';

/* ---------- Hang so ---------- */
var LS_DATA='qlcv_data_v1', LS_CFG='qlcv_cfg_v1', LS_NOTI='qlcv_notified_v1';
var GIST_FILE='quan-ly-cong-viec-data.json';
var PRIO=['Khẩn cấp','Quan trọng','Trung bình','Thông thường'];
var DOW=['Chủ nhật','Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6','Thứ 7'];
var DOW_S=['CN','T2','T3','T4','T5','T6','T7'];
var TITLES={work:'Công việc',proj:'Dự án',cust:'Khách hàng',dash:'Thống kê',notes:'Ghi chú',set:'Cài đặt'};
var STATUS=[['todo','Chưa làm'],['doing','Đang làm'],['done','Hoàn thành']];
var PCOLOR=['#18181b'];
var REMIND=[['','Không nhắc'],['0','Đúng giờ'],['10','10 phút'],['30','30 phút'],['60','1 giờ'],['180','3 giờ'],['1440','1 ngày']];

/* ---------- Luu tru ---------- */
function lsGet(k,def){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch(e){ return def; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

var items=lsGet(LS_DATA,{});            // id -> item
var cfg=lsGet(LS_CFG,{token:'',gistId:'',lastSync:0});
var notified=lsGet(LS_NOTI,{});
var ui={tab:'work',mode:'day',cur:ymd(new Date()),dash:'day',proj:'',openProj:null,fold:{},scrollNow:true,syncState:'',syncMsg:''};

/* ---------- Tien ich ngay gio ---------- */
function pad(n){ return (n<10?'0':'')+n; }
function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseYmd(s){ var a=s.split('-'); return new Date(+a[0],+a[1]-1,+a[2]); }
function addDays(s,n){ var d=parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); }
function weekStart(s){ var d=parseYmd(s); var k=(d.getDay()+6)%7; d.setDate(d.getDate()-k); return ymd(d); }
function today(){ return ymd(new Date()); }
function fmtDay(s){ var d=parseYmd(s); return DOW[d.getDay()]+', '+pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear(); }
function fmtShort(s){ var d=parseYmd(s); return pad(d.getDate())+'/'+pad(d.getMonth()+1); }
function fmtDT(s){ var d=new Date(s); if(isNaN(d)) return ''; return pad(d.getHours())+':'+pad(d.getMinutes())+' '+pad(d.getDate())+'/'+pad(d.getMonth()+1); }
function fmtTime(ms){ var d=new Date(ms); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

/* ---------- Du lieu ---------- */
function all(type){ var out=[]; for(var k in items){ var it=items[k]; if(!it.deleted && it.type===type) out.push(it); } return out; }
function st(t){ return t.status || (t.done?'done':'todo'); }
function setStatus(t,s){ t.status=s; t.done=(s==='done'); t.doneAt=t.done?(t.doneAt||Date.now()):0; }
function projMap(){ var m={}; all('project').forEach(function(p){ m[p.id]=p; }); return m; }
function tasks(){
  var l=all('task'); if(!ui.proj) return l;
  var m=projMap();
  if(ui.proj==='-') return l.filter(function(t){ return !m[t.projectId]; });
  return l.filter(function(t){ return t.projectId===ui.proj; });
}
function tasksOn(d){ return tasks().filter(function(t){ return t.date===d; }); }
function weekStep(){ return (ui.tab==='work'&&ui.mode==='board')||(ui.tab==='dash'&&ui.dash==='week'); }
function monthStep(){ return ui.tab==='work'&&ui.mode==='month'; }
function addMonths(s,n){
  var d=parseYmd(s), day=d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+n);
  d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate())); return ymd(d);
}
function isOverdue(t){
  if(t.done) return false;
  if(t.deadline) return new Date(t.deadline).getTime() < Date.now();
  return t.date < today();
}
function sortTasks(a){
  return a.sort(function(x,y){
    if(!!x.done!==!!y.done) return x.done?1:-1;
    if(x.prio!==y.prio) return x.prio-y.prio;
    var dx=x.deadline||'9999', dy=y.deadline||'9999';
    if(dx!==dy) return dx<dy?-1:1;
    return x.createdAt-y.createdAt;
  });
}
function commit(it){
  it.updatedAt=Date.now();
  items[it.id]=it;
  lsSet(LS_DATA,items);
  render();
  scheduleSync();
  if(it.type==='task' && !it.deleted) checkReminders();
}

  var now=Date.now();
  var t={id:uid(),type:'task',title:o.title,note:o.note||'',date:o.date,deadline:o.deadline||'',prio:o.prio==null?2:o.prio,remind:o.remind||'',projectId:o.projectId||'',done:false,doneAt:0,createdAt:now};
  setStatus(t,o.status||'todo'); commit(t);
}
function addNote(text){ commit({id:uid(),type:'note',title:text,createdAt:Date.now()}); }
function removeItem(id){ var it=items[id]; if(!it) return; commit({id:id,type:it.type,deleted:true,createdAt:it.createdAt}); }

/* ---------- Hien thi ---------- */
var $view=document.getElementById('view'), $datebar=document.getElementById('datebar'), $datelbl=document.getElementById('datelbl');

function secHtml(name,n){ return '<div class="sec">'+name+' <span>'+n+'</span></div>'; }
function taskHtml(t,showDate,moves){
  var s=st(t), od=isOverdue(t), r='';
  if(t.deadline) r=(!showDate && t.deadline.slice(0,10)===t.date)?t.deadline.slice(11,16):fmtDT(t.deadline);
  else if(showDate) r=fmtShort(t.date);
  else if(od) r='Trễ hạn';
  var mv='';
  if(moves && s!=='done') mv='<button class="btn ghost small mv" data-act="move" data-id="'+t.id+'" data-s="'+(s==='todo'?'doing':'done')+'">'+(s==='todo'?'Bắt đầu':'Hoàn tất')+'</button>';
  return '<div class="task'+(s==='done'?' done':'')+(s==='doing'?' doing':'')+'">'+
    '<button class="chk" data-act="toggle" data-id="'+t.id+'" aria-label="Hoàn thành: '+esc(t.title)+'"></button>'+
    '<button class="tb" data-act="edit" data-id="'+t.id+'"><span class="tt">'+esc(t.title)+'</span>'+
    (r?'<span class="tr'+(od?' od':'')+'">'+r+'</span>':'')+
    '<i class="pd p'+t.prio+'" title="'+PRIO[t.prio]+'"></i></button>'+mv+'</div>';
}
function prioOptions(sel){ return PRIO.map(function(n,i){ return '<option value="'+i+'"'+(i===sel?' selected':'')+'>'+n+'</option>'; }).join(''); }

var HOUR=64, EVH=44;
function timedOf(t){ return t.deadline && t.deadline.length>=16 && t.deadline.slice(0,10)===t.date; }
function layoutEv(evs){
  evs.sort(function(a,b){ return a.y-b.y; });
  var cl=[], cur=null;
  evs.forEach(function(e){
    if(!cur || e.y>=cur.end){ cur={end:0,cols:[],items:[]}; cl.push(cur); }

    cur.cols[c]=e.y+EVH; e.col=c; cur.items.push(e); cur.end=Math.max(cur.end,e.y+EVH);
  });
  cl.forEach(function(k){ k.items.forEach(function(e){ e.n=k.cols.length; }); });
  return evs;
}
function foldHead(name,n,key,cap,open,lbls){
  return '<div class="sec">'+name+' <span>'+n+'</span><span class="sp"></span>'+
    ((!cap||n>2)?'<button class="link fb" data-act="fold" data-k="'+key+'">'+(open?lbls[1]:lbls[0])+'</button>':'')+'</div>';
}
function viewDay(){
  var d=ui.cur, list=sortTasks(tasksOn(d));
  var timed=list.filter(timedOf), untimed=list.filter(function(t){ return !timedOf(t); });
  var q='<div class="o4 qbox"><form class="quick q3" data-form="quick">'+
    '<input type="text" id="q_title" data-keep placeholder="Việc mới" aria-label="Việc mới" autocomplete="off" enterkeyhint="done">'+
    '<select id="q_prio" data-keep aria-label="Ưu tiên">'+prioOptions(2)+'</select>'+
    '<button class="btn" type="submit">Thêm mới</button></form>'+
    '<button class="link" data-act="new">Chi tiết</button></div>';
  var adOpen=!!ui.fold.ad;
  var ad='<div class="o2 fold cap'+(adOpen?' open':'')+'">'+foldHead('Cả ngày',untimed.length,'ad',true,adOpen,['Xem hết','Thu gọn'])+

var CSTAT=[['lead','Tiềm năng'],['care','Chăm sóc'],['won','Đã chốt'],['lost','Tạm dừng']];
var CYCLE=7;
function cLabel(v){ for(var i=0;i<CSTAT.length;i++) if(CSTAT[i][0]===v) return CSTAT[i][1]; return ''; }
function cActive(c){ return c.status!=='won' && c.status!=='lost'; }
function dayDiff(a,b){ return Math.round((parseYmd(a)-parseYmd(b))/86400000); }
function cLeft(c){
  if(!cActive(c)) return null;
  var base=c.lastContact||ymd(new Date(c.createdAt||Date.now()));
  return dayDiff(addDays(base,CYCLE),today());
}
function dueCount(){ return all('customer').filter(function(c){ var l=cLeft(c); return l!==null && l<=0; }).length; }
function cInfo(c){
  var l=cLeft(c), last=c.lastContact?('Liên hệ '+fmtShort(c.lastContact)):'Chưa liên hệ';
  if(l===null) return last;

  if(l===0) return last+' &middot; <span class="od">Hôm nay</span>';

}

var SR=window.SpeechRecognition||window.webkitSpeechRecognition, rec=null, recT=null;
function micBtn(t,cls){ return SR?'<button type="button" class="'+(cls||'mic')+'" data-act="mic" data-t="'+t+'" aria-label="Nói để nhập">'+(recT===t?'Dừng nghe':'Giọng nói')+'</button>':''; }
function micUI(){ Array.prototype.forEach.call(document.querySelectorAll('[data-act=mic]'),function(b){
  var on=b.getAttribute('data-t')===recT; b.textContent=on?'Dừng nghe':'Giọng nói'; b.classList.toggle('rec',on); }); }
function stopMic(){ if(rec){ try{ rec.stop(); }catch(e){} } }
function startMic(t){
  var el=document.getElementById(t); if(!el||!SR) return;
  if(rec){ var same=recT===t; stopMic(); if(same) return; }
  var base=el.value, r=new SR(); rec=r; recT=t;
  r.lang='vi-VN'; r.interimResults=true; r.continuous=false; r.maxAlternatives=1;
  r.onresult=function(e){ var txt=''; for(var i=0;i<e.results.length;i++) txt+=e.results[i][0].transcript;
    var x=document.getElementById(t); if(!x) return;
    x.value=base+(base&&!/\s$/.test(base)?' ':'')+txt.trim(); };
  r.onerror=function(e){ if(e.error==='not-allowed'||e.error==='service-not-allowed') toast('Chưa cho phép micro','Bật quyền micro cho trình duyệt trong Cài đặt của máy.');
    else if(e.error!=='no-speech'&&e.error!=='aborted') toast('Không nhận được giọng nói',''); };
  r.onend=function(){ if(rec===r){ rec=null; recT=null; } micUI(); var x=document.getElementById(t); if(x) x.focus(); };
  try{ r.start(); }catch(e){ rec=null; recT=null; toast('Không bật được micro',''); }
  micUI();
}

document.addEventListener('click',function(e){
  if(e.target===$sheet){ closeForm(); return; }
  var tabBtn=e.target.closest('[data-tab]');
  if(tabBtn){ ui.tab=tabBtn.getAttribute('data-tab'); ui.scrollNow=true; render(); window.scrollTo(0,0); return; }
  var b=e.target.closest('[data-act]'); if(!b) return;
  var act=b.getAttribute('data-act'), id=b.getAttribute('data-id'), it=id&&items[id];
  var step=weekStep()?7:1;
  switch(act){
    case 'prev': ui.cur=monthStep()?addMonths(ui.cur,-1):addDays(ui.cur,-step); ui.scrollNow=true; render(); break;
    case 'next': ui.cur=monthStep()?addMonths(ui.cur,1):addDays(ui.cur,step); ui.scrollNow=true; render(); break;
    case 'mcell':
      ui.cur=b.getAttribute('data-d');
      if(window.matchMedia('(max-width:599px)').matches) render();
      else { ui.mode='day'; ui.scrollNow=true; render(); window.scrollTo(0,0); }
      break;
    case 'today': ui.cur=today(); ui.scrollNow=true; render(); break;
    case 'goday': ui.cur=b.getAttribute('data-d'); ui.mode='day'; ui.scrollNow=true; render(); window.scrollTo(0,0); break;
    case 'dash': ui.dash=b.getAttribute('data-m'); render(); break;
    case 'toggle': if(it){ setStatus(it,it.done?'todo':'done'); commit(it); } break;
    case 'move': if(it){ setStatus(it,b.getAttribute('data-s')); commit(it); } break;
    case 'mode': ui.mode=b.getAttribute('data-m'); ui.scrollNow=true; render(); break;
    case 'fold': ui.fold[b.getAttribute('data-k')]=!ui.fold[b.getAttribute('data-k')]; render(); break;
    case 'slot': var sh=+b.getAttribute('data-h'); openForm(null,ui.cur,'',ui.cur+'T'+pad(sh)+':00'); break;
    case 'openproj': ui.openProj=id; render(); window.scrollTo(0,0); break;
    case 'projback': ui.openProj=null; render(); break;
    case 'delproj':
      if(b.getAttribute('data-armed')){ ui.openProj=null; removeItem(id); } else { b.setAttribute('data-armed','1'); b.textContent='Xác nhận?'; }
      break;
    case 'edit': if(it) openForm(it); break;
    case 'mic': startMic(b.getAttribute('data-t')); break;
    case 'editc': if(it) openCust(it); break;
    case 'hnew':
      if(ui.tab==='cust') openCust(null);
      else if(ui.tab==='proj' && !ui.openProj){ var pi=document.getElementById('p_name'); if(pi){ pi.scrollIntoView({block:'center'}); pi.focus(); } }
      else openForm(null,ui.tab==='work'?ui.cur:today(),ui.tab==='proj'?ui.openProj:'');
      break;
    case 'gocust': ui.tab='cust'; render(); window.scrollTo(0,0); break;
    case 'contacted': if(it) markContacted(it,''); break;
    case 'logc':
      if(editC && items[editC]){ var lg=document.getElementById('c_lg'), lv=lg?lg.value.trim():''; closeForm(); markContacted(items[editC],lv); }
      break;
    case 'new': openForm(null,b.getAttribute('data-d')||ui.cur,b.getAttribute('data-p')||''); break;
    case 'close': closeForm(); break;
    case 'del':
      if(!delArmed){ delArmed=true; b.textContent='Xác nhận?'; }
      else { var d=editId; closeForm(); removeItem(d); }
      break;
    case 'delnote':
      if(b.getAttribute('data-armed')){ removeItem(id); } else { b.setAttribute('data-armed','1'); b.textContent='Xác nhận?'; }
      break;
    case 'note2task':
      if(it){ var text=it.title, first=text.split('\n')[0].slice(0,120);
        addTask({title:first,note:text.length>first.length?text:'',date:today(),prio:2});
        removeItem(id); toast('Đã thêm vào hôm nay',first); }
      break;
    case 'savetoken': saveToken(); break;
    case 'syncnow': syncNow(true); break;
    case 'syncoff': cfg.token=''; cfg.gistId=''; cfg.lastSync=0; lsSet(LS_CFG,cfg); ui.syncState=''; render(); break;
    case 'askNoti': askNoti(); break;
    case 'testNoti': notify('Nhắc nhở hoạt động','','test'); break;
    case 'export': exportData(); break;
    case 'import': document.getElementById('s_file').click(); break;
    case 'toastclose': var tt=b.closest('.toast'); if(tt) tt.remove(); break;
  }
});
document.addEventListener('change',function(e){
  if(e.target.id==='projfilter'){ ui.proj=e.target.value; render(); return; }
  if(e.target.id==='s_file' && e.target.files[0]){
    var r=new FileReader();
    r.onload=function(){
      try{ var o=JSON.parse(r.result); var inc=o.items||o; if(typeof inc!=='object') throw 0;
        items=merge(items,inc); lsSet(LS_DATA,items); render(); scheduleSync(); toast('Đã nhập dữ liệu','');
      }catch(err){ toast('File không đúng định dạng',''); }
    };
    r.readAsText(e.target.files[0]);
  }
});
function exportData(){
  var blob=new Blob([JSON.stringify({app:'quan-ly-cong-viec',exportedAt:new Date().toISOString(),items:items},null,2)],{type:'application/json'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='cong-viec-'+today()+'.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(a.href); },1000);
}

/* ---------- Nhac nho ---------- */
function toast(title,body){
  var el=document.createElement('div'); el.className='toast';
  el.innerHTML='<div class="tx"><b>'+esc(title)+'</b>'+esc(body||'')+'</div><button data-act="toastclose">Đóng lại</button>';
  document.getElementById('toasts').appendChild(el);
  return el;
}
function notify(title,body,tag){
  toast(title,body);
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  var opt={body:body,tag:tag||undefined};
  var viaPage=function(){ try{ new Notification(title,opt); }catch(e){} };
  if(navigator.serviceWorker && navigator.serviceWorker.getRegistration){
    navigator.serviceWorker.getRegistration().then(function(reg){ if(reg && reg.showNotification) return reg.showNotification(title,opt); viaPage(); }).catch(viaPage);
  } else viaPage();
}
function askNoti(){
  if(!('Notification' in window)){ render(); return; }
  try{
    var p=Notification.requestPermission(function(){ render(); });
    if(p && p.then) p.then(function(){ render(); });
  }catch(e){ render(); }
}
function checkReminders(){
  var now=Date.now(), changed=checkCustomers();
  all('task').forEach(function(t){
    if(t.done || !t.deadline || t.remind==='' || t.remind==null) return;
    var dl=new Date(t.deadline).getTime(); if(isNaN(dl)) return;
    var fireAt=dl-(+t.remind)*60000, key=t.id+'|'+t.deadline+'|'+t.remind;
    if(now>=fireAt && now<dl+24*3600*1000 && !notified[key]){
      notified[key]=now; changed=true;
      var late=now>dl;
      notify((late?'Quá hạn: ':'Nhắc việc: ')+t.title,PRIO[t.prio]+' · '+fmtDT(t.deadline),t.id);
    }
  });
  if(changed){
    for(var k in notified){ if(now-notified[k]>30*24*3600*1000) delete notified[k]; }
    lsSet(LS_NOTI,notified); render();
  }
}

/* ---------- Dong bo Gist ---------- */
function merge(a,b){
  var out={},k;
  for(k in a) out[k]=a[k];
  for(k in b){ var x=b[k]; if(!x||!x.id) continue; if(!out[k] || (x.updatedAt||0)>(out[k].updatedAt||0)) out[k]=x; }
  var lim=Date.now()-60*24*3600*1000;
  for(k in out){ if(out[k].deleted && (out[k].updatedAt||0)<lim) delete out[k]; }
  return out;
}
function sig(o){ return Object.keys(o).sort().map(function(k){ return k+':'+(o[k].updatedAt||0); }).join(','); }
function gh(path,opt){
  opt=opt||{};
  opt.headers={'Authorization':'Bearer '+cfg.token,'Accept':'application/vnd.github+json'};
  if(opt.body) opt.headers['Content-Type']='application/json';
  opt.cache='no-store';
  return fetch('https://api.github.com'+path,opt).then(function(r){
    if(!r.ok){
      var m=r.status===401?'Token không hợp lệ hoặc đã hết hạn (401).':
            r.status===403?'Token không có quyền gist hoặc vượt giới hạn truy cập (403).':
            r.status===404?'Không tìm thấy Gist dữ liệu (404).':'GitHub trả về lỗi '+r.status+'.';
      var e=new Error(m); e.status=r.status; throw e;
    }
    return r.json();
  });
}
function ensureGist(){
  if(cfg.gistId) return Promise.resolve();
  return gh('/gists?per_page=100').then(function(list){
    for(var i=0;i<list.length;i++){ if(list[i].files && list[i].files[GIST_FILE]){ cfg.gistId=list[i].id; lsSet(LS_CFG,cfg); return; } }
    var files={}; files[GIST_FILE]={content:JSON.stringify({items:{}})};
    return gh('/gists',{method:'POST',body:JSON.stringify({description:'Du lieu app Quan ly cong viec',public:false,files:files})}).then(function(g){ cfg.gistId=g.id; lsSet(LS_CFG,cfg); });
  });
}
var syncBusy=false, syncAgain=false, syncTimer=null;
function scheduleSync(){ if(!cfg.token) return; clearTimeout(syncTimer); syncTimer=setTimeout(function(){ syncNow(false); },1500); }
function syncNow(manual){
  if(!cfg.token) return Promise.resolve();
  if(syncBusy){ syncAgain=true; return Promise.resolve(); }
  syncBusy=true; ui.syncState='busy'; renderSync();
  return ensureGist().then(function(){ return gh('/gists/'+cfg.gistId); }).then(function(g){
    var f=g.files&&g.files[GIST_FILE];
    if(!f) return '{"items":{}}';
    if(f.truncated) return fetch(f.raw_url,{cache:'no-store'}).then(function(r){ return r.text(); });
    return f.content;
  }).then(function(txt){
    var remote={}; try{ remote=(JSON.parse(txt||'{}').items)||{}; }catch(e){ remote={}; }
    var merged=merge(items,remote), sM=sig(merged), localChanged=sM!==sig(items);
    if(localChanged){ items=merged; lsSet(LS_DATA,items); }
    if(sM!==sig(remote)){
      var files={}; files[GIST_FILE]={content:JSON.stringify({updatedAt:Date.now(),items:merged})};
      return gh('/gists/'+cfg.gistId,{method:'PATCH',body:JSON.stringify({files:files})}).then(function(){ return localChanged; });
    }
    return localChanged;
  }).then(function(localChanged){
    cfg.lastSync=Date.now(); lsSet(LS_CFG,cfg); ui.syncState='ok'; ui.syncMsg='';
    if(localChanged||manual||ui.tab==='set') render(); else renderSync();
    if(localChanged) checkReminders();
  }).catch(function(e){
    if(e.status===404){ cfg.gistId=''; lsSet(LS_CFG,cfg); }
    ui.syncState='err'; ui.syncMsg=e.message||'Không kết nối được GitHub.';
    if(manual||ui.tab==='set') render(); else renderSync();
  }).then(function(){
    syncBusy=false;
    if(syncAgain){ syncAgain=false; scheduleSync(); }
  });
}
function saveToken(){
  var v=document.getElementById('s_token').value.trim(), err=document.getElementById('s_err');
  if(!v && !cfg.token){ err.textContent='Cần nhập token.'; return; }
  if(v){ cfg.token=v; cfg.gistId=''; cfg.lastSync=0; lsSet(LS_CFG,cfg); document.getElementById('s_token').value=''; }
  syncNow(true);
}

/* ---------- Khoi dong ---------- */
render();
checkReminders();
syncNow(false);
setInterval(checkReminders,30000);
setInterval(updateNow,60000);
setInterval(function(){ if(!document.hidden) syncNow(false); },60000);
var lastDay=today();
setInterval(function(){ if(today()!==lastDay){ if(ui.cur===lastDay) ui.cur=today(); lastDay=today(); render(); } },60000);
document.addEventListener('visibilitychange',function(){ if(!document.hidden){ checkReminders(); syncNow(false); } });
if('serviceWorker' in navigator && location.protocol==='https:'){ navigator.serviceWorker.register('sw.js').catch(function(){}); }

})();
</script>
